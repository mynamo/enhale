# Render Blueprint — deploys the enhale backend (web service) on Render's free
# tier. The database is Neon (free, persistent Postgres) — set DATABASE_URL to
# your Neon connection string in the Render dashboard after applying.
#
# In Render: New → Blueprint → connect this repo → Apply. Then set
# ANTHROPIC_API_KEY and DATABASE_URL. Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: enhale-backend
    runtime: python
    rootDir: backend            # the FastAPI app lives in backend/
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn enhale_backend.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false             # set in the dashboard (secret)
      - key: DATABASE_URL
        sync: false             # paste your Neon connection string in the dashboard
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5 # cheap; switch to claude-opus-4-8 for sharper insights
      - key: JWT_SECRET
        generateValue: true     # Render generates a strong random secret
