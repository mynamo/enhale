# XcodeGen spec — defines the Xcode project as code.
# Regenerate the .xcodeproj with:  xcodegen generate
# (install XcodeGen once with:  brew install xcodegen)
#
# This avoids hand-editing project.pbxproj and keeps the project reproducible.

name: Enhale
options:
  bundleIdPrefix: com.enhale
  deploymentTarget:
    iOS: "17.0"

packages:
  EnhaleCore:
    path: Core

targets:
  Enhale:
    type: application
    platform: iOS
    sources:
      - App
    info:
      path: App/Info.plist
      properties:
        NSMicrophoneUsageDescription: "enhale uses the microphone so you can speak what you ate instead of typing it."
        NSSpeechRecognitionUsageDescription: "enhale transcribes your spoken meals into text so it can log and analyze them."
        NSHealthShareUsageDescription: "enhale reads your workouts, sleep, and activity from Apple Health to correlate them with your meals and suggest changes."
        NSLocalNetworkUsageDescription: "enhale connects to your enhale backend running on your local network."
        UILaunchScreen: {}
        # DEV ONLY: allow plain HTTP to a backend on your local network (e.g. your
        # Mac's LAN IP during development). Remove this and use HTTPS in production.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: App/Enhale.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enhale.app
        DEVELOPMENT_TEAM: FMBBZWVCFM
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: EnhaleCore
        product: EnhaleCore
